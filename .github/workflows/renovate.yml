# @impl AUT-001-AC2 AUT-001-AC3 AUT-001-AC4
name: Renovate
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify App access and resolve updates without writing branches, PRs or merges
        type: boolean
        required: false
        default: false
permissions: {}
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GHA_IRBE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.GHA_IRBE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read
      # @impl AUT-001-AC4 AUT-001-AC5: exercise real setup without repository mutations.
      - name: Enable non-mutating setup verification
        if: inputs.dry_run
        run: echo 'RENOVATE_DRY_RUN=full' >> "$GITHUB_ENV"
      - name: Update this repository
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_BRANCH_PREFIX: renovate-actions/
          RENOVATE_IGNORE_SCRIPTS: 'true'
