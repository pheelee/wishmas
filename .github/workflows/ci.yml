# @impl AUT-001-AC1: require the "Go tests" status check on main.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify dependencies, vet and run Go tests with race checks
        run: scripts/check-go.sh
        env:
          WISHMAS_COVERAGE_FILE: ${{ runner.temp }}/coverage.out
      # @impl AUT-002-AC1 AUT-002-AC2: scanners share the required Go status check.
      - name: Lint Go code including security checks
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          args: ./...
      - name: Check reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Test release version and publication guards
        run: python3 -B -m unittest discover -s tests/release -v
      # @impl COV-001-AC1 COV-001-AC2: PR jobs have no repository write permission.
      - name: Generate coverage badge and report
        run: python3 scripts/coverage_badge.py "$RUNNER_TEMP/coverage.out" "$RUNNER_TEMP/coverage-site" "$GITHUB_SHA"
      - name: Store successful main coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: ${{ runner.temp }}/coverage.out
          if-no-files-found: error
          retention-days: 7
  coverage:
    name: Publish Go coverage
    needs: go-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-coverage
          path: ${{ runner.temp }}/coverage-profile
      - name: Publish badge branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 scripts/coverage_badge.py "$RUNNER_TEMP/coverage-profile/coverage.out" "$RUNNER_TEMP/coverage-site" "$GITHUB_SHA" --publish "https://github.com/$GITHUB_REPOSITORY.git"
