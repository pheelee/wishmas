# @impl REL-002-AC3: optional detailed checks; no publication privileges.
name: Detailed container checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  containers:
    name: Detailed containers (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [en-US, de-CH]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Install browser test tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build local test image
        run: docker build -t wishmas-container-check:local .
      - name: Verify focused release smoke
        if: matrix.language == 'en-US'
        env:
          WISHMAS_SMOKE_IMAGE: wishmas-container-check:local
        run: node tests/container/release-smoke.cjs
      - name: Validate Compose and detailed HTTPS persistence flows
        env:
          WISHMAS_SMOKE_IMAGE: wishmas-container-check:local
          WISHMAS_SMOKE_LANGUAGE: ${{ matrix.language }}
        run: |
          node tests/container/compose.cjs
          node tests/container/smoke.cjs
