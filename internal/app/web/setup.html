{{template "head" .}}
<main class="page relative z-10 mx-auto max-w-2xl px-6 pt-20 pb-4 sm:pt-28">
 <p class="mb-4 text-sm font-semibold uppercase tracking-widest text-mint">A little Christmas magic</p>
 <h1 class="font-serif text-[clamp(2.5rem,4vw,3.5rem)] text-ivory">Make room for wishes.</h1>
 <p class="mt-5 text-mist">Set up your household, then share a little joy.</p>
 <form method="post" action="/setup/prepare" class="mt-10 space-y-6 rounded-3xl border border-ice/25 bg-panel panel p-8 shadow-sm">
  {{if .Error}}<p role="alert" class="rounded-lg bg-error p-4 text-coral">{{.Error}}</p>{{end}}
  <div><label for="household" class="block font-semibold">Household name</label>
  <input id="household" name="household" value="{{.Name}}" required minlength="3" maxlength="50" autocomplete="organization" class="mt-2 w-full rounded-lg border border-ice/60 px-3 py-3">
  <p class="mt-2 text-sm text-mist">3–50 letters and digits. Accented letters are welcome.</p></div>
  <div><label for="timezone" class="block font-semibold">Household timezone</label>
  <input id="timezone" name="timezone" value="{{.Timezone}}" required list="timezones" placeholder="Europe/Zurich" class="mt-2 w-full rounded-lg border border-ice/60 px-3 py-3">
  <datalist id="timezones"></datalist>
  <p class="mt-2 text-sm text-mist">Your Christmas year changes on January 1 in this timezone.</p></div>
  <button class="w-full rounded-xl bg-mint primary-action px-5 py-3 font-semibold text-night hover:bg-mint-bright">Create access links <span aria-hidden="true">→</span></button>
 </form>
</main>
{{template "foot" .}}
