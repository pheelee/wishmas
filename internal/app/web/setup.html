{{template "head" .}}
<main class="mx-auto max-w-xl px-6 py-16">
 <p class="mb-4 text-sm font-semibold uppercase tracking-widest text-emerald-800">A little Christmas magic</p>
 <h1 class="font-serif text-5xl text-emerald-950">Make room for wishes.</h1>
 <p class="mt-5 text-stone-600">Set up your household, then share a little joy.</p>
 <form method="post" action="/setup/prepare" class="mt-10 space-y-6 rounded-3xl border border-emerald-900/10 bg-white p-8 shadow-sm">
  {{if .Error}}<p role="alert" class="rounded-lg bg-red-50 p-4 text-red-800">{{.Error}}</p>{{end}}
  <div><label for="household" class="block font-semibold">Household name</label>
  <input id="household" name="household" value="{{.Name}}" required minlength="3" maxlength="50" autocomplete="organization" class="mt-2 w-full rounded-lg border border-stone-300 px-3 py-3">
  <p class="mt-2 text-sm text-stone-500">3–50 letters and digits. Accented letters are welcome.</p></div>
  <div><label for="timezone" class="block font-semibold">Household timezone</label>
  <input id="timezone" name="timezone" value="{{.Timezone}}" required list="timezones" placeholder="Europe/Zurich" class="mt-2 w-full rounded-lg border border-stone-300 px-3 py-3">
  <datalist id="timezones"></datalist>
  <p class="mt-2 text-sm text-stone-500">Your Christmas year changes on January 1 in this timezone.</p></div>
  <button class="w-full rounded-xl bg-emerald-900 px-5 py-3 font-semibold text-white hover:bg-emerald-800">Create access links <span aria-hidden="true">→</span></button>
 </form>
</main>
{{template "foot" .}}
