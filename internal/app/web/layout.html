{{define "head"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark"><title>Wishmas · Christmas wishlists</title><link rel="stylesheet" href="/assets/app.css"><script defer src="/assets/app.js"></script></head>
<body class="min-h-screen bg-night text-cloud">
<!-- @impl CON-003-AC1 CON-003-AC2 CON-003-AC3 CON-003-AC4 CON-003-AC5 -->
<div class="snowfall" data-snow data-paused="true" aria-hidden="true" inert>
<div class="snow-side snow-side-left"><span class="snowflake" style="--x:8%;--size:1px;--duration:22s;--delay:-3s;--opacity:0.14"></span><span class="snowflake" style="--x:19%;--size:2px;--duration:29s;--delay:-14s;--opacity:0.18"></span><span class="snowflake" style="--x:30%;--size:3px;--duration:36s;--delay:-25s;--opacity:0.22"></span><span class="snowflake" style="--x:41%;--size:1px;--duration:24s;--delay:-36s;--opacity:0.26"></span><span class="snowflake" style="--x:52%;--size:2px;--duration:31s;--delay:-10s;--opacity:0.30"></span><span class="snowflake" style="--x:63%;--size:3px;--duration:38s;--delay:-21s;--opacity:0.14"></span><span class="snowflake" style="--x:74%;--size:1px;--duration:26s;--delay:-32s;--opacity:0.18"></span><span class="snowflake" style="--x:85%;--size:2px;--duration:33s;--delay:-6s;--opacity:0.22"></span></div>
<div class="snow-side snow-side-right"><span class="snowflake" style="--x:8%;--size:3px;--duration:40s;--delay:-17s;--opacity:0.26"></span><span class="snowflake" style="--x:19%;--size:1px;--duration:28s;--delay:-28s;--opacity:0.30"></span><span class="snowflake" style="--x:30%;--size:2px;--duration:35s;--delay:-39s;--opacity:0.14"></span><span class="snowflake" style="--x:41%;--size:3px;--duration:23s;--delay:-13s;--opacity:0.18"></span><span class="snowflake" style="--x:52%;--size:1px;--duration:30s;--delay:-24s;--opacity:0.22"></span><span class="snowflake" style="--x:63%;--size:2px;--duration:37s;--delay:-35s;--opacity:0.26"></span><span class="snowflake" style="--x:74%;--size:3px;--duration:25s;--delay:-9s;--opacity:0.30"></span><span class="snowflake" style="--x:85%;--size:1px;--duration:32s;--delay:-20s;--opacity:0.14"></span></div>
</div>
<header class="site-header relative z-10 px-6 py-6">
 <div class="mx-auto flex max-w-6xl items-center justify-between gap-4">
  <div class="flex items-center gap-3"><span aria-hidden="true" class="text-2xl text-gold">✦</span><span class="font-serif text-[1.75rem] font-bold text-ivory">wishmas<span class="text-coral">.</span></span></div>
  <button type="button" data-snow-toggle hidden class="snow-toggle rounded-full border border-ice/25 px-3 py-2 text-xs text-mist hover:border-mint/70 hover:text-cloud">Pause snow</button>
 </div>
</header>
<div class="light-strand" data-christmas-lights aria-hidden="true" inert>
 <svg viewBox="0 0 1440 112" preserveAspectRatio="none" focusable="false" aria-hidden="true"><path d="M-10 5 Q720 125 1450 5"/></svg>
<span class="bulb bulb-coral" style="--left:2.50%;--drop:10.85px"></span><span class="bulb bulb-mint" style="--left:8.09%;--drop:22.84px"></span><span class="bulb bulb-gold" style="--left:13.68%;--drop:33.33px"></span><span class="bulb bulb-blue" style="--left:19.26%;--drop:42.33px"></span><span class="bulb bulb-coral" style="--left:24.85%;--drop:49.82px"></span><span class="bulb bulb-mint" style="--left:30.44%;--drop:55.82px"></span><span class="bulb bulb-gold" style="--left:36.03%;--drop:60.32px"></span><span class="bulb bulb-blue" style="--left:41.62%;--drop:63.31px"></span><span class="bulb bulb-coral" style="--left:47.21%;--drop:64.81px"></span><span class="bulb bulb-mint" style="--left:52.79%;--drop:64.81px"></span><span class="bulb bulb-gold" style="--left:58.38%;--drop:63.31px"></span><span class="bulb bulb-blue" style="--left:63.97%;--drop:60.32px"></span><span class="bulb bulb-coral" style="--left:69.56%;--drop:55.82px"></span><span class="bulb bulb-mint" style="--left:75.15%;--drop:49.82px"></span><span class="bulb bulb-gold" style="--left:80.74%;--drop:42.33px"></span><span class="bulb bulb-blue" style="--left:86.32%;--drop:33.33px"></span><span class="bulb bulb-coral" style="--left:91.91%;--drop:22.84px"></span><span class="bulb bulb-mint" style="--left:97.50%;--drop:10.85px"></span>
</div>
{{end}}
{{define "foot"}}<footer class="relative z-10 mx-auto mt-10 w-full max-w-2xl px-6 py-8 text-sm text-mist">Made for wishes, shared with family.</footer></body></html>{{end}}
