{{template "head" .}}
<main class="mx-auto max-w-xl px-6 py-16">
 <p class="mb-4 text-sm font-semibold uppercase tracking-widest text-emerald-800">Nearly ready</p>
 <h1 class="font-serif text-4xl text-emerald-950">A Christmas for {{.Name}}.</h1>
 <p class="mt-5 text-stone-600">Keep your parent link, and share the family link with your gift-givers.</p>
 <div class="mt-8 space-y-6 rounded-3xl border border-emerald-900/10 bg-white p-8 shadow-sm">
  <div><label for="parent-link" class="block font-semibold">Parent link</label><p class="mt-1 text-sm text-stone-500">For managing your household and wishlists.</p>
  <input id="parent-link" name="parent_link" value="{{.ParentLink}}" readonly class="mt-2 w-full rounded-lg border border-stone-300 p-3 text-sm"><button type="button" data-copy="parent-link" class="mt-2 rounded-lg border border-emerald-900 px-4 py-2 text-sm font-semibold text-emerald-900">Copy parent link</button></div>
  <div><label for="family-link" class="block font-semibold">Family link</label><p class="mt-1 text-sm text-stone-500">For viewing this year's wishes and claiming gifts.</p>
  <input id="family-link" name="family_link" value="{{.FamilyLink}}" readonly class="mt-2 w-full rounded-lg border border-stone-300 p-3 text-sm"><button type="button" data-copy="family-link" class="mt-2 rounded-lg border border-emerald-900 px-4 py-2 text-sm font-semibold text-emerald-900">Copy family link</button></div>
  <p id="copy-status" role="status" class="text-sm text-emerald-800"></p>
  <form method="post" action="/setup/finish"><input type="hidden" name="ticket" value="{{.Ticket}}"><button class="w-full rounded-xl bg-emerald-900 px-5 py-3 font-semibold text-white hover:bg-emerald-800">Finish setup</button></form>
 </div>
</main>{{template "foot" .}}
