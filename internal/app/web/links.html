{{template "head" .}}
<main class="page relative z-10 mx-auto max-w-2xl px-6 pt-20 pb-4 sm:pt-28">
 <p class="mb-4 text-sm font-semibold uppercase tracking-widest text-mint">Nearly ready</p>
 <h1 class="font-serif text-4xl text-ivory">A Christmas for {{.Name}}.</h1>
 <p class="mt-5 text-mist">Keep your parent link, and share the family link with your gift-givers.</p>
 <div class="mt-8 space-y-6 rounded-3xl border border-ice/25 bg-panel panel p-8 shadow-sm">
  {{template "access-link-rows" .}}
  <p id="copy-status" role="status" class="text-sm text-mint"></p>
  <form method="post" action="/setup/finish"><input type="hidden" name="ticket" value="{{.Ticket}}"><button class="w-full rounded-xl bg-mint primary-action px-5 py-3 font-semibold text-night hover:bg-mint-bright">Finish setup</button></form>
 </div>
</main>{{template "foot" .}}
