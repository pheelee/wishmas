# Reference only: configure your existing Traefik HTTPS routing/network first.
# @impl CON-001-AC5 CON-001-AC6
services:
  wishmas:
    image: wishmas:local
    build:
      context: .
    user: "${WISHMAS_UID:-1000}:${WISHMAS_GID:-1000}"
    environment:
      WISHMAS_ADDR: ":8080"
      WISHMAS_DATA_DIR: /data
      # Optional S3 YAML backend. Images/fallback/logout state still need /data.
      WISHMAS_STORAGE: "${WISHMAS_STORAGE:-local}"
      WISHMAS_S3_ENDPOINT: "${WISHMAS_S3_ENDPOINT:-}"
      WISHMAS_S3_BUCKET: "${WISHMAS_S3_BUCKET:-}"
      WISHMAS_S3_REGION: "${WISHMAS_S3_REGION:-us-east-1}"
      WISHMAS_S3_ACCESS_KEY_ID: "${WISHMAS_S3_ACCESS_KEY_ID:-}"
      WISHMAS_S3_SECRET_ACCESS_KEY: "${WISHMAS_S3_SECRET_ACCESS_KEY:-}"
      WISHMAS_S3_SESSION_TOKEN: "${WISHMAS_S3_SESSION_TOKEN:-}"
      WISHMAS_S3_TIMEOUT: "${WISHMAS_S3_TIMEOUT:-5s}"
      # Actual trusted Traefik peer IPs/CIDRs; no proxy is trusted by default.
      WISHMAS_TRUSTED_PROXIES: "${WISHMAS_TRUSTED_PROXIES:-}"
    volumes:
      # Use your prepared version-2 data root, writable by the chosen UID/GID.
      # Existing ownership is not changed. Do not mount live legacy data here.
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    # Join Traefik to this service's network and configure HTTPS forwarding.
    # The backend has no public host-port mapping.
    expose:
      - "8080"
